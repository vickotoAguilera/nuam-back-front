services:
  db:
    image: postgres:15-alpine
    container_name: nuam-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - ./sql:/docker-entrypoint-initdb.d
      - nuam_data:/var/lib/postgresql/data
volumes:
  nuam_data:
